<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mehedi | Web Portfolio</title>
    <style>
        :root {
            --bg: #f5f5f5;          /* Light Gray */
            --card-bg: #ffffff;
            --text-main: #1a1a1a;   /* Near Black */
            --text-muted: #666666;  /* Medium Gray */
            --accent: #333333;      /* Dark Gray */
            --border: #dddddd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            padding: 4rem 1.5rem;
        }

        .container {
            max-width: 550px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 4rem;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            margin-bottom: 0.5rem;
            filter: grayscale(100%);
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
        }

        /* Social Icons */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }

        .social-links a {
            color: var(--accent);
            transition: transform 0.2s, opacity 0.2s;
            display: flex;
            align-items: center;
        }

        .social-links a:hover {
            transform: translateY(-2px);
            opacity: 0.7;
        }

        .icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Projects Section */
        section h2 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-muted);
            margin-bottom: 2rem;
            text-align: center;
        }

        .project-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .project-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .project-card:hover {
            border-color: var(--accent);
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .project-card h3 {
            font-size: 1.1rem;
            margin-bottom: 0.4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .project-card h3::after {
            content: "→";
            font-weight: 300;
            opacity: 0.3;
        }

        .project-card p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        footer {
            margin-top: 6rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            letter-spacing: 0.05em;
        }

        /* Grayscale Filter for the whole site */
        .grayscale-theme {
            filter: grayscale(100%);
        }
    </style>
</head>
<body>
